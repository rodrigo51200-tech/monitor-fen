name: Monitor FEN

on:
  schedule:
        # Respaldo: GitHub se salta la mayoria de estas corridas (en la practica corre cada 3-7 h).
        # La frecuencia real de 15 min la da el job "encadenar" (al final), que relanza el workflow.
        # Si la cadena se corta, la proxima corrida programada que GitHub si ejecute la reinicia.
        # Los pronosticos solo se recalculan cada 4 h (pronostico.py).
       - cron: "7,22,37,52 * * * *"
  workflow_dispatch:         # permite ejecutarlo a mano ("Run workflow")

permissions:
  contents: write            # guardar historial y HTML en el repositorio
  actions: write             # el job "encadenar" relanza este mismo workflow
  pages: write               # publicar en GitHub Pages
  id-token: write

# La concurrencia va por job (no por workflow) para que la espera de "encadenar"
# no deje en cola una corrida forzada a mano.

jobs:
  # 1) Genera el HTML, guarda historial en el repo y deja listo el paquete para Pages.
  actualizar:
    runs-on: ubuntu-24.04      # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19/10/2026
    concurrency:               # una sola a la vez: dos pushes al mismo tiempo chocan
      group: monitor-fen-actualizar
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      TZ: America/Lima
      MONITOR_HTML: docs/index.html
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Resolver ENFEN por DNS público (el DNS de GitHub no lo encuentra)
        run: |
          IP=$(curl -s "https://dns.google/resolve?name=enfen.imarpe.gob.pe&type=A" | python3 -c "import json,sys; a=[x['data'] for x in json.load(sys.stdin).get('Answer',[]) if x.get('type')==1]; print(a[-1] if a else '')")
          if [ -n "$IP" ]; then echo "$IP enfen.imarpe.gob.pe" | sudo tee -a /etc/hosts; fi

      - name: Ejecutar monitor
        run: python -u monitor_fen.py
        timeout-minutes: 15

      - name: Guardar historial y HTML en el repositorio
        run: |
          git config user.name "monitor-fen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs historial resumen_teams.txt cache 2>/dev/null || git add docs historial resumen_teams.txt
          git commit -m "Monitor FEN $(date +'%Y-%m-%d %H:%M')" || echo "Sin cambios"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # 2) Publica en GitHub Pages. Si falla, se puede relanzar solo este job
  #    ("Re-run failed jobs") sin volver a correr el monitor.
  publicar:
    needs: actualizar
    runs-on: ubuntu-24.04
    concurrency:
      group: monitor-fen-pages
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - id: deploy
        name: Publicar en Pages (intento 1)
        uses: actions/deploy-pages@v4
        continue-on-error: true    # un error 500 de GitHub no corta aquí; se reintenta abajo

      - name: Esperar antes de reintentar
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning::Falló la publicación en Pages (intento 1). Reintentando en 60 s."
          sleep 60

      - id: deploy2
        name: Publicar en Pages (intento 2)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # 3) Mantiene la frecuencia de 15 min: espera hasta completar 15 min desde que empezo
  #    esta corrida y relanza el workflow ("Run workflow"). GitHub si respeta este disparo,
  #    a diferencia del cron. No depende de "publicar": si Pages falla, la cadena sigue.
  #    Para apagarla: Settings -> Secrets and variables -> Actions -> Variables ->
  #    MONITOR_CADENA = off  (o cancelar a mano una corrida: una cancelada no se relanza).
  #    Si hay otra corrida mas nueva en marcha (p. ej. una forzada a mano), esta no relanza:
  #    la cadena sigue desde la mas nueva y nunca quedan dos cadenas a la vez.
  encadenar:
    needs: actualizar
    if: ${{ !cancelled() && vars.MONITOR_CADENA != 'off' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      INTERVALO_SEG: 900
    steps:
      - name: Esperar hasta completar el intervalo
        run: |
          INICIO=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          TRANSCURRIDO=$(( $(date +%s) - $(date -d "$INICIO" +%s) ))
          ESPERA=$(( INTERVALO_SEG - TRANSCURRIDO ))
          echo "Corrida iniciada $INICIO, van ${TRANSCURRIDO}s; espero ${ESPERA}s"
          if [ "$ESPERA" -gt 0 ]; then sleep "$ESPERA"; fi

      - name: Relanzar el monitor (si no hay una corrida mas nueva)
        run: |
          MAS_NUEVAS=$(gh api "repos/${{ github.repository }}/actions/workflows/monitor_fen.yml/runs?per_page=30"             --jq "[.workflow_runs[] | select(.status != \"completed\" and .run_number > ${{ github.run_number }})] | length")
          if [ "$MAS_NUEVAS" -gt 0 ]; then
            echo "Hay $MAS_NUEVAS corrida(s) mas nueva(s) en marcha: la cadena sigue desde ahi."
            exit 0
          fi
          gh workflow run monitor_fen.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

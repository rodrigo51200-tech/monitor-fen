name: Diagnostico noticias

# Prueba de solo lectura de las fuentes gratuitas para alertas por noticias:
# Google News RSS, Bing News RSS y GitHub Models (IA gratuita dentro de Actions).
# Guarda las respuestas en diagnostico/ de esta rama (no toca main ni Pages).
on:
  push:
    branches: [claude/beautiful-archimedes-k90jnz]
    paths: [.github/workflows/diagnostico_noticias.yml]

permissions:
  contents: write
  models: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Probar fuentes
        run: |
          mkdir -p diagnostico
          python3 - <<'PY' | tee diagnostico/resultado.txt
          import json, os, time, urllib.error, urllib.parse, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) MonitorFEN-SagaFalabella/1.0"}
          def get(url, headers=None, data=None, t=30):
              req = urllib.request.Request(url, headers={**UA, **(headers or {})}, data=data)
              t0 = time.time()
              with urllib.request.urlopen(req, timeout=t) as r:
                  return r.status, dict(r.headers), r.read(), time.time() - t0
          Q = '({c}) (inundación OR lluvia OR lluvias OR huaico OR desborde OR aniego OR anegad OR damnificados)'
          for ciudad in ("Piura", "Chiclayo", "Trujillo", "Tumbes", "Lima"):
              q = Q.format(c=ciudad)
              for nombre, url in (
                  ("google", "https://news.google.com/rss/search?q=" + urllib.parse.quote(q + " when:1d") + "&hl=es-419&gl=PE&ceid=PE:es-419"),
                  ("bing", "https://www.bing.com/news/search?format=rss&q=" + urllib.parse.quote(q))):
                  try:
                      st, h, body, dt = get(url)
                      n = body.count(b"<item>")
                      open(f"diagnostico/{nombre}_{ciudad.lower()}.xml", "wb").write(body)
                      print(f"{nombre:6} {ciudad:9} -> HTTP {st}, {n} noticias, {dt:.1f}s")
                  except Exception as e:
                      print(f"{nombre:6} {ciudad:9} -> ERROR {e}")
          print("-----")
          tok = os.environ["GH_TOKEN"]
          H = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}
          def crudo(url, data=None):
              try:
                  st, h, body, dt = get(url, H, data, 60)
              except urllib.error.HTTPError as e:
                  st, h, body, dt = e.code, dict(e.headers), e.read(), 0
              except Exception as e:
                  print("   ERROR", e); return None
              lim = {k: v for k, v in h.items() if "ratelimit" in k.lower()}
              print(f"   HTTP {st} | {h.get('Content-Type')} | {len(body)} bytes | límites {lim}")
              print("   ", body[:400])
              return body
          print("Catálogo GitHub Models:")
          b = crudo("https://models.github.ai/catalog/models")
          try:
              for m in json.loads(b):
                  print("    ", m.get("id"), "|", m.get("rate_limit_tier"))
          except Exception:
              pass
          for modelo in ("openai/gpt-4.1-mini", "openai/gpt-4.1", "meta/Llama-3.3-70B-Instruct"):
              print("Modelo", modelo)
              crudo("https://models.github.ai/inference/chat/completions", json.dumps({
                  "model": modelo, "max_tokens": 50,
                  "messages": [{"role": "user", "content": 'Responde solo con JSON {"ok": true}'}]}).encode())
          PY

      - name: Guardar resultados en la rama
        run: |
          git config user.name "monitor-fen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostico
          git commit -m "Diagnóstico: respuestas de fuentes de noticias" || echo "Sin cambios"
          git pull --rebase
          git push

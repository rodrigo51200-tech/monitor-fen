name: Diagnostico SENAMHI

# Prueba de solo lectura: acceso a IDESEP por HTTP y HTTPS desde GitHub y capas disponibles.
# No publica ni guarda nada. Corre solo al subir cambios a esta rama.
on:
  push:
    branches: [claude/beautiful-archimedes-k90jnz]
    paths: [.github/workflows/diagnostico_senamhi.yml]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Conexion TCP y DNS
        run: |
          getent hosts idesep.senamhi.gob.pe || echo "DNS sin respuesta"
          for p in 80 443; do
            if timeout 15 bash -c "</dev/tcp/idesep.senamhi.gob.pe/$p"; then echo "puerto $p: ABIERTO"; else echo "puerto $p: SIN RESPUESTA"; fi
          done

      - name: Capas y conteos por HTTP
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          BASE = "http://idesep.senamhi.gob.pe/geoserver/wfs?service=WFS&version=1.1.0"
          def get(url, t=60):
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "MonitorFEN-SagaFalabella/1.0"}), timeout=t) as r:
                  return r.read().decode("utf-8", "replace")
          try:
              cap = get(BASE + "&request=GetCapabilities", 90)
              nombres = re.findall(r"<Name>([^<]+)</Name>", cap)
              print(f"GetCapabilities OK: {len(nombres)} capas")
              for n in nombres:
                  if re.search(r"aviso|quebr|umbral|_pp|prono|lluv", n, re.I):
                      print("  ", n)
          except Exception as e:
              print("GetCapabilities ERROR:", e)
          print("-----")
          capas = ["g_aviso:view_aviso", "g_prono_pp_24h:view_aviso24h", "g_acti_quebrada:view_av_activ_qdra",
                   "g_umbrales:umbrales_precipitacion", "monitoreo_meteorologico:tmax_1_all_points",
                   "monitoreo_meteorologico:prec_1_all_points", "spc:prono_verano_poligono"]
          for c in capas:
              try:
                  j = json.loads(get(BASE + f"&request=GetFeature&typeName={c}&outputFormat=application/json&maxFeatures=2"))
                  ej = (j.get("features") or [{}])[0].get("properties", {})
                  print(f"{c} -> {j.get('totalFeatures')} | ejemplo: {json.dumps(ej, ensure_ascii=False)[:300]}")
              except Exception as e:
                  print(f"{c} -> ERROR {e}")
          PY
